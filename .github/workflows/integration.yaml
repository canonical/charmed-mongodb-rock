name: Operator Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v41.0.0
    permissions:
      actions: read # Needed for GitHub API call to get workflow version
      contents: read

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: build
    strategy:
      matrix:
        env: [integration, sharding-integration]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          provider: microk8s
          channel: "1.35-strict/stable"
          bootstrap-constraints: "cores=2 mem=2G"
          juju-channel: 3.6/stable
          charmcraft-channel: "latest/candidate"
      - name: Install rockcraft
        run: |
          sudo snap install rockcraft --classic
      - name: Download rock package(s)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Install tox & poetry
        run: |
          pipx install tox
          pipx install poetry
          pipx install charmcraftcache
          pipx inject poetry poetry-plugin-export
      - name: Install yq
        run: |
          sudo snap install yq --classic
      - name: Integration Tests
        run: |
          sg snap_microk8s -c "tox -e ${{ matrix.env }}"
      - name: Free disk space
        run: |
          echo "Free disk space after int tests"
          df -T
          # free space in the runner
          rockcraft clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Free disk after int tests"
          df -T
